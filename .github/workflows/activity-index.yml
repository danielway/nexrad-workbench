name: Build activity index

# Lists each radar site's archive days and publishes one small summary file
# per site under activity-index/ on gh-pages, for the timeline overview's
# storm-activity bars (see tools/activity_index/README.md). Each run resumes
# from the files already published: the first runs backfill the archive
# within a request budget, later ones only add the newest days.

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
    inputs:
      budget:
        description: "Most S3 requests this run"
        required: false
        default: "100000"
      max_minutes:
        description: "Stop starting new days after this many minutes"
        required: false
        default: "40"

permissions:
  contents: write

concurrency:
  group: activity-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout builder
        uses: actions/checkout@v7

      - name: Checkout gh-pages
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: pages

      - name: Test builder
        run: python3 tools/activity_index/test_build_index.py

      - name: Build index
        env:
          BUDGET: ${{ inputs.budget || '100000' }}
          MAX_MINUTES: ${{ inputs.max_minutes || '40' }}
        run: |
          python3 tools/activity_index/build_index.py \
            --out pages/activity-index \
            --budget "$BUDGET" \
            --max-minutes "$MAX_MINUTES"

      - name: Publish
        working-directory: pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add activity-index
          if git diff --cached --quiet; then
            echo "Index unchanged"
            exit 0
          fi
          git commit -q -m "Update activity index through $(python3 -c 'import json;print(json.load(open("activity-index/status.json"))["through"])')"
          # A site deploy or PR preview may have pushed meanwhile; they never
          # touch activity-index/, so rebasing onto them is clean.
          for delay in 2 4 8 16 32; do
            if git push origin HEAD:gh-pages; then
              exit 0
            fi
            sleep "$delay"
            git pull -q --rebase origin gh-pages
          done
          git push origin HEAD:gh-pages
