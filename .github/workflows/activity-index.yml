name: Build activity index

# Lists each radar site's archive days and publishes one small summary file
# per site under activity-index/ on gh-pages, for the timeline overview's
# storm-activity bars, plus per-site month files of every volume's start and
# size for its volume zoom (see tools/activity_index/README.md). Each run
# resumes from the files already published: the first runs backfill the
# archive within a request budget, later ones only add the newest days.
#
# The nightly run never re-lists a day already indexed. Days indexed before
# month files existed get theirs from a manual run with backfill_months
# ticked (the default when dispatched), newest first, within the budget; a
# day once backfilled is never listed again.

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
    inputs:
      budget:
        description: "Most S3 requests this run"
        required: false
        default: "100000"
      max_minutes:
        description: "Stop starting new days after this many minutes (at most 330; the job gets 20 more)"
        required: false
        default: "40"
      backfill_months:
        description: "Also re-list indexed days that have no month file data yet, newest first"
        type: boolean
        required: false
        default: true
      month_files:
        description: "Keep month files for the newest N months (0 keeps every month)"
        required: false
        default: "12"

permissions:
  contents: write

concurrency:
  group: activity-index
  cancel-in-progress: false

jobs:
  # GitHub disables a public repository's scheduled workflows after 60 days
  # without activity in it. Enabling this workflow again every night, which
  # it already is, keeps the schedule from lapsing while nobody commits.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/activity-index.yml/enable"

  # The builder stops starting new days at max_minutes, then finishes the
  # batch in flight and writes its files; Publish runs after that. The build
  # job's timeout must outlast all of it or the listing is thrown away, so
  # it is max_minutes + 20 (40 -> 60 by default). Expressions can't add, so
  # this job computes it. 330 + 20 stays under the 360-minute runner limit.
  limits:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      max_minutes: ${{ steps.calc.outputs.max_minutes }}
      job_minutes: ${{ steps.calc.outputs.job_minutes }}
    steps:
      - id: calc
        env:
          MAX_MINUTES: ${{ inputs.max_minutes || '40' }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import math, os
          m = float(os.environ["MAX_MINUTES"])
          if not 0 < m <= 330:
              raise SystemExit("max_minutes must be in (0, 330], got %s" % m)
          print("max_minutes=%g" % m)
          print("job_minutes=%d" % (math.ceil(m) + 20))
          PY

  build:
    needs: limits
    runs-on: ubuntu-latest
    # max_minutes + 20: see the limits job.
    timeout-minutes: ${{ fromJSON(needs.limits.outputs.job_minutes) }}
    steps:
      - name: Checkout builder
        uses: actions/checkout@v7

      - name: Checkout gh-pages
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: pages

      - name: Test builder
        run: python3 tools/activity_index/test_build_index.py

      - name: Build index
        env:
          BUDGET: ${{ inputs.budget || '100000' }}
          # Scheduled runs have no inputs: no backfill, the default window.
          BACKFILL_MONTHS: ${{ inputs.backfill_months && '--backfill-months' || '' }}
          MONTH_FILES: ${{ inputs.month_files || '12' }}
          # The job timeout is derived from this; see the limits job.
          MAX_MINUTES: ${{ needs.limits.outputs.max_minutes }}
          # Print checkpoints as they happen, not all at exit.
          PYTHONUNBUFFERED: "1"
        run: |
          python3 tools/activity_index/build_index.py \
            --out pages/activity-index \
            --budget "$BUDGET" \
            --max-minutes "$MAX_MINUTES" \
            --month-files "$MONTH_FILES" \
            $BACKFILL_MONTHS

      - name: Publish
        working-directory: pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -A: month files the builder pruned are deleted too.
          git add -A activity-index
          if git diff --cached --quiet; then
            echo "Index unchanged"
            exit 0
          fi
          git commit -q -m "Update activity index through $(python3 -c 'import json;print(json.load(open("activity-index/status.json"))["through"])')"
          # A site deploy or PR preview may have pushed meanwhile; they never
          # touch activity-index/, so rebasing onto them is clean.
          for delay in 2 4 8 16 32; do
            if git push origin HEAD:gh-pages; then
              exit 0
            fi
            sleep "$delay"
            git pull -q --rebase origin gh-pages
          done
          git push origin HEAD:gh-pages
