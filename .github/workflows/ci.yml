name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  formatting:
    name: Formatting check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust (stable, rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust (stable, clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Clippy
        # --all-targets so #[cfg(test)] code is linted too; matches the
        # pre-commit hook in .cargo-husky/hooks/pre-commit.
        run: cargo clippy --target wasm32-unknown-unknown --all-targets -- -D warnings

  build:
    name: Build check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --target wasm32-unknown-unknown --release

  tests:
    name: Pure-Rust logic tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --locked --version 0.2.127

      # Inline `#[wasm_bindgen_test]` blocks across the bin's `src/` tree.
      # Run in node (default) — no browser needed. ~50ms.
      - name: Run logic tests
        run: cargo test --bin nexrad-workbench

  idb-integration:
    name: IndexedDB integration tests (Chromium)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --locked --version 0.2.127

      # ubuntu-latest ships chromium + chromedriver in apt. Headless
      # Chromium drives the wasm-bindgen-test-runner; tests/idb.rs is
      # configured `run_in_browser`.
      - name: Install Chromium + chromedriver
        run: sudo apt-get update && sudo apt-get install -y chromium-browser chromium-chromedriver

      - name: Run IDB integration tests
        env:
          CHROMEDRIVER: /usr/bin/chromedriver
        run: cargo test --test idb

  # Advisories on the locked graph (native TLS path included via --target all).
  # Keep in lockstep with scripts/bootstrap.sh installing cargo-audit.
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit dependencies
        run: cargo audit
