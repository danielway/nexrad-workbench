# Keep GitHub Actions and Cargo deps current without drowning the PR queue.
# Security updates still open immediately (outside this schedule).
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # glow must match the version eframe/egui_glow re-export (we hand
      # eframe's glow::Context to our renderers); bump it with egui.
      - dependency-name: glow
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      cargo:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"
